<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1573" viewBox="0 0 1000 1573">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7b87"/>
      <stop offset=".14" stop-color="#f4f8fb"/>
      <stop offset=".3" stop-color="#9eacb7"/>
      <stop offset=".48" stop-color="#ffffff"/>
      <stop offset=".68" stop-color="#778793"/>
      <stop offset=".84" stop-color="#e5edf2"/>
      <stop offset="1" stop-color="#596b78"/>
    </linearGradient>
    <linearGradient id="silverBright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#bfccd5"/>
      <stop offset="1" stop-color="#6d7d89"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff8ff"/>
      <stop offset=".45" stop-color="#6cccf1"/>
      <stop offset="1" stop-color="#21678f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#071018" flood-opacity=".75"/>
    </filter>
    <g id="corner" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M33 169V92Q33 43 82 43H169" stroke="#18232c" stroke-width="16"/>
      <path d="M33 169V92Q33 43 82 43H169" stroke="url(#silverBright)" stroke-width="7"/>
      <path d="M49 145C56 92 93 56 145 49" stroke="#1b2a34" stroke-width="19"/>
      <path d="M49 145C56 92 93 56 145 49" stroke="url(#silver)" stroke-width="8"/>
      <path d="M42 116C72 103 96 80 106 47C124 78 151 95 184 97C153 112 130 138 126 173C107 146 77 128 42 116Z" fill="#273743" stroke="url(#silverBright)" stroke-width="5"/>
      <path d="M63 114C85 100 99 83 107 61M94 132C108 111 127 99 151 94" stroke="#f5fbff" stroke-width="3"/>
      <circle cx="89" cy="82" r="12" fill="#273743" stroke="url(#silverBright)" stroke-width="4"/>
      <path d="M68 151 83 137 98 152 83 167Z" fill="url(#ice)" stroke="#e8fbff" stroke-width="3"/>
    </g>
  </defs>

  <!-- Exact 1000×1573 transparent canvas. No image, text or plaque is embedded. -->
  <rect x="15" y="15" width="970" height="1543" rx="52" fill="none" stroke="#12202a" stroke-width="34" filter="url(#shadow)"/>
  <rect x="15" y="15" width="970" height="1543" rx="52" fill="none" stroke="url(#silver)" stroke-width="27"/>
  <rect x="29" y="29" width="942" height="1515" rx="42" fill="none" stroke="#f5fbff" stroke-opacity=".8" stroke-width="3"/>
  <rect x="45" y="45" width="910" height="1483" rx="29" fill="none" stroke="#1c2a34" stroke-width="10"/>
  <rect x="49" y="49" width="902" height="1475" rx="25" fill="none" stroke="url(#silverBright)" stroke-width="4"/>
  <rect x="58" y="58" width="884" height="1457" rx="21" fill="none" stroke="#eaf6fb" stroke-opacity=".75" stroke-width="2"/>

  <g filter="url(#shadow)">
    <use href="#corner"/>
    <use href="#corner" transform="translate(1000 0) scale(-1 1)"/>
    <use href="#corner" transform="translate(0 1573) scale(1 -1)"/>
    <use href="#corner" transform="translate(1000 1573) scale(-1 -1)"/>
  </g>

  <!-- restrained Nordic ice rune crest; kept in the frame band, away from artwork text -->
  <g transform="translate(500 62)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M-74 6H74M-59 18 0-23 59 18" stroke="url(#silverBright)" stroke-width="6"/>
    <path d="M0-47 38 0 0 47-38 0Z" fill="#243946" stroke="url(#silver)" stroke-width="7"/>
    <path d="M0-29V29M-15-12 0 3 15-12M-15 12 0-3 15 12" stroke="url(#ice)" stroke-width="5"/>
    <path d="M-54-12-38 0M54-12 38 0" stroke="#f5fbff" stroke-width="3"/>
  </g>

  <!-- small bottom center closure; no protruding tail or blank panel -->
  <path d="M438 1524H562" stroke="url(#silverBright)" stroke-width="4"/>
  <path d="M481 1524 500 1505 519 1524 500 1543Z" fill="#273743" stroke="url(#silverBright)" stroke-width="4"/>
</svg>
