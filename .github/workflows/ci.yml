name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Validate structured mythology content
        run: npm run content:validate

      - name: Generate Norse content coverage and readiness report
        run: npm run content:coverage:norse

      - name: Audit public artwork provenance
        run: npm run provenance:audit -- --strict

      - name: Verify D1 migrations
        run: npm run migration:check

      - name: Build, typecheck and Worker dry run
        run: npm run check

      - name: Profile Worker startup
        run: npx wrangler check startup

      - name: Upload Worker startup profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-startup-profile
          if-no-files-found: warn
          path: worker-startup.cpuprofile
