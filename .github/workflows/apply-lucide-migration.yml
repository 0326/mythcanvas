name: Apply Lucide migration

on:
  push:
    branches:
      - feat/lucide-icon-system
    paths:
      - scripts/migrate-lucide-icons.mjs

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/lucide-icon-system

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply icon migration
        run: node scripts/migrate-lucide-icons.mjs

      - name: Validate build
        run: npm run build

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md .agents/skills/mythcanvas-product-ux/SKILL.md src/pages/index.astro src/pages/explore/index.astro src/pages/create/index.astro
          git commit -m "refactor(ui): migrate functional glyphs to Lucide"
          git push origin HEAD:feat/lucide-icon-system
